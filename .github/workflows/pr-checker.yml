name: Pr Checker

on: [pull_request]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: yarn install --frozen-lockfile

      - name: Install Chromium for PDF generation
        run: yarn playwright:install

      # Same macOS PDF path as production CI.
      - name: Build site and PDFs
        run: yarn build
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

  visual-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn add @percy/cli -D

      - run: mkdir -p theme-dist/light && mkdir -p theme-dist/dark

      - run: yarn build:light --base light
        env:
          NOTION_API_KEY: ${{secrets.NOTION_API_KEY}}
          DATABASE_ID: ${{secrets.DATABASE_ID}}

      - run: cp -R dist/* theme-dist/light

      - run: yarn build:dark --base dark
        env:
          NOTION_API_KEY: ${{secrets.NOTION_API_KEY}}
          DATABASE_ID: ${{secrets.DATABASE_ID}}

      - run: cp -R dist/* theme-dist/dark

      - run: npx percy snapshot theme-dist/
        env:
          PERCY_TOKEN: ${{secrets.PERCY_TOKEN}}
